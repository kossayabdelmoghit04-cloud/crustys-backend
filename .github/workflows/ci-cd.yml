name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend/backend

      - name: Run ESLint
        run: npm run lint
        working-directory: backend/backend

  test-and-build:
    name: Test & Build Compilation
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: crustys_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend/backend

      - name: Setup environment variables for tests
        run: |
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/crustys_test_db?schema=public" >> .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "JWT_SECRET=supersecretjwtkeyatleast32characterslongforci" >> .env
          echo "JWT_REFRESH_SECRET=supersecretrefreshkeyatleast32characterslongforci" >> .env
          echo "NODE_ENV=test" >> .env
        working-directory: backend/backend

      - name: Run Prisma Client Generation
        run: npx prisma generate
        working-directory: backend/backend

      - name: Run Database Migrations
        run: npx prisma migrate deploy
        working-directory: backend/backend

      - name: Run Unit Tests
        run: npm run test:unit
        working-directory: backend/backend

      - name: Run Security Tests
        run: npm run test:security
        working-directory: backend/backend

      - name: Run Integration Tests
        run: npm run test:integration
        working-directory: backend/backend

      - name: Build Application Compilation
        run: npm run build
        working-directory: backend/backend

  verify-docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Verify Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: ./backend/backend
          file: ./backend/backend/Dockerfile
          push: false
          tags: crustys-express-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
