version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: crustys-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: crustys-grafana
    ports:
      - "3001:3000" # Mapped to 3001 to avoid conflict with the backend CORS config frontend port 3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
